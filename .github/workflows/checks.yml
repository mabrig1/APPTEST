name: APPTEST checks
on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Run app checks
        run: node --test tests/check.mjs
