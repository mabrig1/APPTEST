name: APPTEST checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript
        run: |
          node --check public/app.js
          node --check functions/_lib/common.js
          node --check functions/api/status.js
          node --check functions/api/lead.js
          node --check functions/api/proposal.js
      - name: Run offline tests
        run: node --test tests/*.mjs
