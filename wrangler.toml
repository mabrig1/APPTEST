# APPTEST deploys as a Cloudflare Worker (not Pages).
# Connected build command: none. Deploy command: npx wrangler deploy.
name = "apptest"
main = "./worker/index.js"
compatibility_date = "2026-11-13"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[vars]
APPTEST_PUBLIC_URL = "https://apptest.mabrigkorie.org"

# Real API keys must be installed as encrypted Cloudflare Worker secrets.
# AI_ENABLED and EMAIL_ENABLED stay unset/disabled until credentials are ready.
